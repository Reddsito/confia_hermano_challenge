<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>HUELGA · Confia Hermano Challenge</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500&family=Azeret+Mono:wght@500;600&display=swap">
<style>
  :root {
    --void: #0c0a09; --carbon: #16130f;
    --line: #2e2721; --line-strong: #4a4034;
    --ink: #f5efe4; --ink-2: #a89b88; --ink-3: #6e6355;
    --accent: #ff9d1e; --red: #f2554d;
    --display: 'Barlow Condensed', ui-sans-serif, sans-serif;
    --sans: 'Barlow', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Azeret Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 50% 0%, #241c13 0%, var(--void) 60%);
    color: var(--ink); font-family: var(--sans);
  }
  .rail { height: 2px; background: var(--accent); }
  header {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    padding: 20px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line);
  }
  .eyebrow { font: 600 11px/1 var(--mono); letter-spacing: .25em; text-transform: uppercase; color: var(--accent); }
  .brand { margin: 8px 0 0; font: 700 clamp(1.5rem, 4vw, 2.2rem)/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .status { display: flex; align-items: center; gap: 8px; font: 600 11px/1 var(--mono); letter-spacing: .2em; color: var(--red); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px #f2554d33; animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  main { flex: 1; display: grid; place-items: center; padding: 32px 16px; }
  .card {
    width: min(100%, 1100px); text-align: center;
    background: var(--carbon); border: 1px solid var(--line-strong); border-radius: 2px;
    padding: clamp(32px, 7vw, 80px) clamp(16px, 4vw, 48px);
    box-shadow: inset 0 2px 0 var(--red);
  }
  .card .eyebrow { color: var(--ink-3); }
  h1 {
    margin: 16px 0 0; font: 800 clamp(5rem, 24vw, 17rem)/.85 var(--display);
    text-transform: uppercase; letter-spacing: .01em; color: var(--red);
  }
  .sub {
    margin: 20px 0 0; font: 700 clamp(1.8rem, 7vw, 5rem)/1 var(--display);
    text-transform: uppercase; letter-spacing: .03em;
  }
  .note { margin: 24px auto 0; max-width: 46ch; color: var(--ink-2); font-size: clamp(.9rem, 2vw, 1.05rem); line-height: 1.5; }
  footer { padding: 16px clamp(16px, 4vw, 40px); border-top: 1px solid var(--line); font: 500 11px/1 var(--mono); letter-spacing: .2em; color: var(--ink-3); text-transform: uppercase; }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
  <div class="rail"></div>
  <header>
    <div>
      <div class="eyebrow">Temporada 2</div>
      <p class="brand">Confia Hermano Challenge</p>
    </div>
    <div class="status"><span class="dot"></span>BANDERA ROJA</div>
  </header>
  <main>
    <section class="card">
      <div class="eyebrow">Carrera suspendida</div>
      <h1>Huelga</h1>
      <p class="sub">No a la corrupción</p>
      <p class="note">El challenge vuelve pronto.</p>
    </section>
  </main>
  <footer>Pit wall · fuera de servicio</footer>
</body>
</html>
