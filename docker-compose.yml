services:
  api:
    build:
      # Built from the repo root so the shared packages/core is in scope.
      # .dockerignore keeps .env, the local database and the frontend out.
      context: .
      dockerfile: apps/server/Dockerfile
    image: challenge-api
    container_name: challenge-api
    restart: unless-stopped
    env_file:
      - apps/server/.env
    environment:
      PORT: 8787
      DATABASE_PATH: /repo/apps/server/data/challenge.db
    volumes:
      # Named volume, not a path inside the image: the SQLite file has to
      # outlive every rebuild, otherwise the accumulated totals reset.
      - challenge-data:/repo/apps/server/data
    networks:
      - proxy
    # No ports are published on purpose. The only way in is through the reverse
    # proxy, which reaches this container by name on the shared network.

networks:
  proxy:
    # The network an existing Caddy/nginx/Traefik container already runs on.
    # Find it with:
    #   docker inspect <proxy-container> \
    #     --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  challenge-data:
